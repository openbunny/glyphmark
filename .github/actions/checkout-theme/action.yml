name: Checkout theme
description: Places openbunny/theme next to the workspace, where package.json and project.yml resolve ../openbunny-theme.
inputs:
  token:
    description: Token with read access to openbunny/theme.
    required: true
runs:
  using: composite
  steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: openbunny/theme
        path: openbunny-theme
        token: ${{ inputs.token }}
        persist-credentials: false
    - shell: bash
      run: mv "$GITHUB_WORKSPACE/openbunny-theme" "$GITHUB_WORKSPACE/../openbunny-theme"
