rules:
  - id: swift-network-api
    languages: [swift]
    severity: ERROR
    message: >-
      This extension ships everything bundled: no network request, no telemetry, no remote font, script or icon at runtime. `URLSession`, `URLRequest` and `NWConnection` have no legitimate call site in the containing app or the extension handler; the icon set and its attribution notices are generated at build time and shipped in the bundle, never fetched.
    pattern-either:
      - pattern: URLSession.$S.dataTask(...)
      - pattern: URLSession.$S.downloadTask(...)
      - pattern: URLSession.$S.uploadTask(...)
      - pattern: "URLSession.$S.data(for: ...)"
      - pattern: "URLSession(configuration: $C)"
      - pattern: NWConnection(...)
  - id: swift-absence-to-sentinel
    languages: [swift]
    severity: ERROR
    message: >-
      A failable numeric parse coalesced to zero on failure turns "this value could not be represented" into "this value is zero"; the two are indistinguishable downstream. AGENTS.md § Swift: absence remains optional and never becomes zero. Keep the `nil`, or throw a specific error.
    # Any numeric parse whose failure becomes zero loses the same information.
    # `AppTests/EffectiveBuildSettingsTests.swift` decodes xcodebuild output
    # with `?? ""`; no branch fires on `String(bytes:encoding:)`.
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $T($S) ?? 0
              - pattern: "$T(string: $S) ?? 0"
              - pattern: $T($S) ?? .zero
              - pattern: "$T(string: $S) ?? .zero"
          - metavariable-regex:
              metavariable: $T
              regex: "^(Decimal|Double|Float|Int|Int8|Int16|Int32|Int64|UInt|UInt8|UInt16|UInt32|UInt64)$"
      - pattern-regex: '\b(?:Decimal|Double|Float|Int(?:8|16|32|64)?|UInt(?:8|16|32|64)?)\((?:string:\s*)?[^()]*\)\.map\s*\{\s*\$0\s*\}\s*\?\?\s*0\b'
  - id: swift-dynamic-code-construction
    languages: [swift]
    severity: ERROR
    message: >-
      No dynamic code construction in a bundled-everything extension. `NSClassFromString`, `NSExpression` and `dlopen` all resolve a name or a string to executable code at runtime, which is exactly what a static extension with no remote input has no reason to do.
    pattern-either:
      - pattern: NSClassFromString(...)
      - pattern: dlopen(...)
      - pattern: NSExpression(...)
  - id: swift-committed-signing-identifier
    languages: [generic]
    severity: ERROR
    message: >-
      No development team, signing certificate or provisioning profile anywhere in committed files: every extension build passes with `CODE_SIGNING_ALLOWED=NO`. A concrete `DEVELOPMENT_TEAM`, `CODE_SIGN_IDENTITY` or `PROVISIONING_PROFILE*` key in a committed `project.yml` pins a real Apple Developer identity into version control.
    paths:
      include:
        - "/project.yml"
        - "/fixtures/*/project.yml"
    pattern-regex: '(?m)^\s*(DEVELOPMENT_TEAM|CODE_SIGN_IDENTITY|PROVISIONING_PROFILE|PROVISIONING_PROFILE_SPECIFIER)\s*:'
